name: static analysis

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan level 6 · composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2, phpstan:2
      - run: composer update --no-interaction --no-progress
      - name: Static analysis
        run: phpstan analyse --no-progress
      - name: Known vulnerabilities in dependencies
        run: composer audit --no-interaction
